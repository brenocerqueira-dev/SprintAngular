<div class="container-fluid vh-100 p-0">
  <div class="row g-0 h-100">
    
    <div class="col-lg-7 d-none d-lg-block side-image"></div>

    <div class="col-lg-5 d-flex align-items-center justify-content-center form-section">
      <div class="w-100 px-4" style="max-width: 420px;">
        
        <div class="text-center mb-4">
          <img src="/imagens/logo-ford-256.png" alt="Ford Logo" class="ford-logo mb-4">
          <h5 class="fw-bold text-dark mb-3">PORTAL DO PROPRIETÁRIO</h5>
          <p class="text-muted small fw-bold">SEJA BEM-VINDO</p>
        </div>

        <form (ngSubmit)="fazerLogin()">
          <div class="mb-3">
            <label for="usuario" class="form-label small text-dark">E-MAIL</label>
            <input type="text" class="form-control form-control-lg fs-6" id="usuario" name="usuario" placeholder="Digite seu e-mail" [(ngModel)]="usuario" required>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label for="senha" class="form-label small text-dark">SENHA</label>
                <a href="#" class="small text-decoration-none">Esqueci minha senha</a>
            </div>
            <input type="password" class="form-control form-control-lg fs-6" id="senha" name="senha" placeholder="******" [(ngModel)]="senha" required>
          </div>

          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input shadow-none" id="lembrar">
            <label class="form-check-label small text-dark" for="lembrar">Mantenha-me conectado</label>
          </div>

          <div class="d-grid gap-2 mb-4">
            <button type="submit" class="btn btn-primary btn-lg custom-btn rounded-1">ENTRAR</button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
